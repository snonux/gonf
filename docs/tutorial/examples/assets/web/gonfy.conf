# Gonfy's site: static pages plus a password-protected status page.
<VirtualHost *:80>
    ServerName gonfy.example.org
    DocumentRoot "/var/www/gonfy/htdocs"
    DirectoryIndex index.html
    <Directory "/var/www/gonfy/htdocs">
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    <Location "/server-status">
        SetHandler server-status
        AuthType Basic
        AuthName "Gonfy's lodge"
        AuthUserFile "/etc/httpd/gonfy.htpasswd"
        Require valid-user
    </Location>
</VirtualHost>
